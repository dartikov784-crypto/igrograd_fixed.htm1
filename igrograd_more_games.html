<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#111827"><title>Игроград — мини-игры</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#172554,#090d1b 65%);color:#f8fafc;font-family:system-ui,Arial,sans-serif}header{text-align:center;padding:24px 12px}h1{font-size:clamp(32px,8vw,48px);margin:0}header p{color:#cbd5e1}.wrap{max-width:900px;margin:auto;padding:0 12px 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.tile{background:#1e293b;color:white;border:1px solid #475569;border-radius:16px;padding:16px 8px;min-height:120px;font:inherit}.tile span{display:block;font-size:34px}.tile b{display:block;margin-top:6px}.panel{display:none;margin-top:14px;padding:16px;background:#172033;border:1px solid #475569;border-radius:18px}.panel.show{display:block}.game{margin-top:12px;padding:14px;background:#0b1222;border-radius:14px;text-align:center;min-height:150px}.btn{background:#7c3aed;color:white;border:0;border-radius:10px;padding:11px 14px;margin:4px;font:inherit;font-weight:700}.secondary{background:#334155}input{padding:11px;width:130px;border-radius:9px;border:1px solid #64748b;background:#0b1222;color:white}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:270px;margin:12px auto}.cell{height:78px;font-size:27px;background:#334155;color:white;border:0;border-radius:10px}.tap{padding:35px 8px;border-radius:12px;background:#334155;font-weight:bold;margin:12px 0}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:320px;margin:12px auto}.mem{aspect-ratio:1;font-size:24px;background:#334155;color:white;border:0;border-radius:9px}.footer{text-align:center;color:#94a3b8;font-size:12px;padding:20px}
</style></head><body><header><h1>🎮 ИГРОГРАД</h1><p>12 мини-игр — играйте прямо в браузере!</p></header><main class="wrap"><div class="grid" id="grid"></div><section class="panel" id="panel"><button class="btn secondary" onclick="closeGame()">← Назад к играм</button><h2 id="title"></h2><div class="game" id="area"></div></section><div class="footer">Игроград • Бесплатные мини-игры для телефона и компьютера</div></main>
<script>
const list=[['⭐','Поймай звезду','star'],['🧠','Память','memory'],['❌','Крестики-нолики','ttt'],['✊','Камень, ножницы, бумага','rps'],['🔢','Угадай число','guess'],['➕','Математика','math'],['⚡','Реакция','reaction'],['🐹','Поймай зверька','mole'],['🎨','Угадай цвет','color'],['🐍','Змейка','snake'],['❓','Викторина','quiz'],['🎯','Попади в цель','target']];
const grid=document.querySelector('#grid'),panel=document.querySelector('#panel'),area=document.querySelector('#area');list.forEach(([e,n,id])=>{let b=document.createElement('button');b.className='tile';b.innerHTML=`<span>${e}</span><b>${n}</b>`;b.onclick=()=>start(id,n);grid.appendChild(b)});
let ts=[],clean=null;function later(f,n){let t=setTimeout(f,n);ts.push(t)}function every(f,n){let t=setInterval(f,n);ts.push(t)}function closeGame(){ts.forEach(clearTimeout);ts.forEach(clearInterval);ts=[];if(clean)clean();clean=null;panel.classList.remove('show');area.innerHTML=''}function start(id,n){closeGame();panel.classList.add('show');document.querySelector('#title').textContent=n;({star,memory,ttt,rps,guess,math,reaction,mole,color,snake,quiz,target}[id])();panel.scrollIntoView({behavior:'smooth'})}
function button(t,f,c=''){let b=document.createElement('button');b.className='btn '+c;b.textContent=t;b.onclick=f;return b}function msg(t){let p=document.createElement('p');p.textContent=t;area.appendChild(p)}
function star(){let s=0,t=15;area.innerHTML='<h2>⭐ Счёт: <span id="s">0</span></h2><p id="time">15 секунд</p><div id="f"></div>';let f=document.querySelector('#f');function spawn(){f.innerHTML='';f.appendChild(button('⭐',()=>{s++;document.querySelector('#s').textContent=s;spawn()}))}spawn();every(()=>{t--;document.querySelector('#time').textContent=t+' секунд';if(t<=0){ts.forEach(clearInterval);f.innerHTML='';msg('Игра окончена! Ваш счёт: '+s);area.appendChild(button('Ещё раз',star))}},1000)}
function memory(){let a=['🍎','🚀','🐱','⚽','🍕','🌈','🐸','🎲', '🍎','🚀','🐱','⚽','🍕','🌈','🐸','🎲'].sort(()=>Math.random()-.5),first=null,lock=false,found=0,moves=0;area.innerHTML='<p>Найдите все одинаковые пары.</p><p id="m">Ходы: 0</p><div class="memory" id="mem"></div>';a.forEach(v=>{let b=button('? ',()=>{if(lock||b.dataset.done||b.textContent!=='? ')return;b.textContent=v;if(!first){first={b,v};return}moves++;document.querySelector('#m').textContent='Ходы: '+moves;if(first.v===v){first.b.dataset.done=1;b.dataset.done=1;found++;first=null;if(found===8)msg('🎉 Вы нашли все пары!')}else{let old=first;first=null;lock=true;later(()=>{old.b.textContent='? ';b.textContent='? ';lock=false},650)}});b.className='mem';document.querySelector('#mem').appendChild(b)})}
function ttt(){let a=Array(9).fill(''),end=false;area.innerHTML='<p>Вы — ❌, компьютер — ⭕</p><div class="board" id="bd"></div><p id="st">Ваш ход</p>';let bd=document.querySelector('#bd');function winner(x){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(c=>c.every(i=>x[i]&&x[i]===x[c[0]]))}function draw(){bd.innerHTML='';a.forEach((v,i)=>{let b=button(v||' ',()=>move(i));b.className='cell';bd.appendChild(b)})}function check(){if(winner(a)){end=true;document.querySelector('#st').textContent=winner(a.slice())?(a.includes('❌')&&[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,5,6]].some(c=>c.every(i=>a[i]==='❌'))?'Вы победили!':'Компьютер победил!'):'Игра окончена';return true}if(a.every(Boolean)){end=true;document.querySelector('#st').textContent='Ничья!';return true}return false}function move(i){if(end||a[i])return;a[i]='❌';draw();if(check())return;let op=a.map((v,i)=>v?null:i).filter(v=>v!==null);a[op[Math.floor(Math.random()*op.length)]]='⭕';draw();check()}draw();area.appendChild(button('Заново',ttt))}
function rps(){area.innerHTML='<p>Выберите ход:</p>';let out=document.createElement('h3');area.appendChild(out);[['✊','Камень'],['✋','Бумага'],['✌️','Ножницы']].forEach(([e,n],i)=>area.insertBefore(button(e+' '+n,()=>{let j=Math.floor(Math.random()*3),names=['Камень','Бумага','Ножницы'];out.textContent='Вы: '+n+'. Компьютер: '+names[j]+'. '+(i===j?'Ничья!':(i-j+3)%3===1?'Вы выиграли!':'Вы проиграли!')}),out))}
function guess(){let n=1+Math.floor(Math.random()*100),tries=0;area.innerHTML='<p>Загадано число от 1 до 100.</p><input id="num" type="number" placeholder="Ваше число"><button class="btn" id="chk">Проверить</button><p id="hint"></p>';document.querySelector('#chk').onclick=()=>{let v=+document.querySelector('#num').value,h=document.querySelector('#hint');if(v<1||v>100){h.textContent='Введите число от 1 до 100';return}tries++;h.textContent=v===n?'🎉 Угадали за '+tries+' попыток!':v<n?'Моё число больше.':'Моё число меньше.'}}
function math(){let s=0,t=30,x,y,op;area.innerHTML='<h2 id="p"></h2><input id="ans" type="number" placeholder="Ответ"><button class="btn" id="send">Ответить</button><p id="inf">Счёт: 0 • 30 сек.</p>';function next(){x=1+Math.floor(Math.random()*12);y=1+Math.floor(Math.random()*12);op=['+','−','×'][Math.floor(Math.random()*3)];if(op==='−'&&y>x)[x,y]=[y,x];document.querySelector('#p').textContent=`${x} ${op} ${y} = ?`;document.querySelector('#ans').value=''}function ans(){let v=op==='+'?x+y:op==='−'?x-y:x*y;if(+document.querySelector('#ans').value===v)s++;next();document.querySelector('#inf').textContent=`Счёт: ${s} • ${t} сек.`}document.querySelector('#send').onclick=ans;document.querySelector('#ans').onkeydown=e=>{if(e.key==='Enter')ans()};next();every(()=>{t--;document.querySelector('#inf').textContent=`Счёт: ${s} • ${t} сек.`;if(t<=0){ts.forEach(clearInterval);document.querySelector('#p').textContent='Время вышло!';document.querySelector('#inf').textContent='Результат: '+s;document.querySelector('#send').disabled=true}},1000)}
function reaction(){area.innerHTML='<p>Нажмите «Старт», ждите зелёного и быстро коснитесь поля.</p><div class="tap" id="tap">Готовы?</div><p id="res"></p>';let state=0,at=0,box=document.querySelector('#tap');area.insertBefore(button('Старт',()=>{state=1;box.style.background='#a83252';box.textContent='Ждите...';later(()=>{if(state!==1)return;state=2;at=performance.now();box.style.background='#087f5b';box.textContent='ЖМИТЕ!'},1000+Math.random()*2500)}),box);box.onclick=()=>{if(state===1){state=0;document.querySelector('#res').textContent='Слишком рано! Нажмите «Старт».'}else if(state===2){document.querySelector('#res').textContent='Ваша реакция: '+Math.round(performance.now()-at)+' мс';state=0;box.style.background='#334155';box.textContent='Ещё раз?'}}}
function mole(){let s=0,t=15;area.innerHTML='<p>Нажимайте на 🐹!</p><h3 id="sc">Счёт: 0</h3><div class="grid" id="holes"></div><p id="tm">15 секунд</p>';let h=document.querySelector('#holes');for(let i=0;i<9;i++){let b=button('🕳️',()=>{if(b.textContent==='🐹'){s++;document.querySelector('#sc').textContent='Счёт: '+s;b.textContent='🕳️'}});h.appendChild(b)}function pop(){[...h.children].forEach(b=>b.textContent='🕳️');h.children[Math.floor(Math.random()*9)].textContent='🐹'}pop();every(pop,650);every(()=>{t--;document.querySelector('#tm').textContent=t+' секунд';if(t<=0){ts.forEach(clearInterval);msg('Игра окончена! Счёт: '+s)}},1000)}
function color(){let c=[['Красный','#f43f5e'],['Синий','#3b82f6'],['Зелёный','#10b981'],['Жёлтый','#facc15'],['Фиолетовый','#a78bfa'],['Оранжевый','#fb923c']],ans;area.innerHTML='<h3 id="q"></h3><div id="opts"></div><p id="fb"></p>';function next(){document.querySelector('#opts').innerHTML='';document.querySelector('#fb').textContent='';ans=c[Math.floor(Math.random()*c.length)];document.querySelector('#q').textContent='Найдите цвет: '+ans[0];c.slice().sort(()=>Math.random()-.5).forEach(v=>{let b=button(v[0],()=>{if(v===ans){document.querySelector('#fb').textContent='Правильно! 🎉';later(next,650)}else document.querySelector('#fb').textContent='Попробуйте ещё.'});b.style.background=v[1];b.style.color=v[0]==='Жёлтый'?'#111':'white';document.querySelector('#opts').appendChild(b)})}next()}
function snake(){area.innerHTML='<p>Змейка: собирайте яблоки кнопками.</p><canvas id="cv" width="240" height="240" style="width:min(100%,300px);background:#080d19"></canvas><p id="sc">Счёт: 0</p><div id="dirs"></div>';let cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),n=12,z=20,s=[{x:5,y:5},{x:4,y:5}],d={x:1,y:0},f={x:8,y:5},score=0,dead=false;[['⬆️',0,-1],['⬅️',-1,0],['⬇️',0,1],['➡️',1,0]].forEach(([e,x,y])=>document.querySelector('#dirs').appendChild(button(e,()=>{if(x!==-d.x||y!==-d.y)d={x,y}})));let key=e=>{let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();if(m[0]!==-d.x||m[1]!==-d.y)d={x:m[0],y:m[1]}}};window.addEventListener('keydown',key);clean=()=>window.removeEventListener('keydown',key);function draw(){ctx.clearRect(0,0,240,240);ctx.font='18px sans-serif';ctx.fillText('🍎',f.x*z,f.y*z+17);s.forEach((p,i)=>{ctx.fillStyle=i?'#34d399':'#8b5cf6';ctx.fillRect(p.x*z+1,p.y*z+1,18,18)})}draw();every(()=>{if(dead)return;let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||s.some(p=>p.x===h.x&&p.y===h.y)){dead=true;msg('Игра окончена! Счёт: '+score);return}s.unshift(h);if(h.x===f.x&&h.y===f.y){score++;document.querySelector('#sc').textContent='Счёт: '+score;f={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}else s.pop();draw()},190)}
function quiz(){let q=[['Какая планета ближе к Солнцу?',['Меркурий','Земля','Марс'],0],['Сколько будет 7 × 8?',['54','56','64'],1],['Царь зверей?',['Тигр','Лев','Волк'],1],['Сколько дней в високосном году?',['365','366','367'],1],['Самый большой океан?',['Индийский','Тихий','Атлантический'],1]],i=0,s=0;function show(){if(i===q.length){area.innerHTML=`<h2>Готово!</h2><p>Ваш результат: ${s} из ${q.length}</p>`;area.appendChild(button('Заново',()=>{i=0;s=0;show()}));return}area.innerHTML=`<p>Вопрос ${i+1} из ${q.length}</p><h3>${q[i][0]}</h3><div id="opts"></div><p id="fb"></p>`;q[i][1].forEach((v,j)=>{let b=button(v,()=>{if(j===q[i][2])s++;document.querySelector('#fb').textContent=j===q[i][2]?'Верно!':'Ответ: '+q[i][1][q[i][2]];i++;later(show,750)},'secondary');b.style.display='block';document.querySelector('#opts').appendChild(b)})}show()}
function target(){let s=0,t=15;area.innerHTML='<h3 id="sc">Очки: 0</h3><p>Нажимайте на цель 15 секунд!</p><div class="tap" id="tar">🎯</div><p id="tm">15 секунд</p>';document.querySelector('#tar').onclick=()=>{if(t>0){s++;document.querySelector('#sc').textContent='Очки: '+s;document.querySelector('#tar').textContent=['🎯','⭐','💎','🏆'][Math.floor(Math.random()*4)]}};every(()=>{t--;document.querySelector('#tm').textContent=t+' секунд';if(t<=0){ts.forEach(clearInterval);msg('Игра окончена! Результат: '+s)}},1000)}
</script></body></html>
